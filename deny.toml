# cargo-deny configuration (Spec 002 SR-040). Run: cargo deny check advisories licenses

[graph]
targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "aarch64-apple-darwin",
]

[advisories]
# Fail on any RustSec vulnerability, unmaintained, unsound, or yanked notice.
unmaintained = "all"
yanked = "deny"

[licenses]
# Permissive licenses, plus MPL-2.0 (file-level copyleft; used unmodified by option-ext).
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
]
confidence-threshold = 0.9

[licenses.private]
# MaxonKey itself is unpublished (`publish = false`); only dependencies are checked.
ignore = true
