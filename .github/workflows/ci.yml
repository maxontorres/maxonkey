name: Rust CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install stable Rust
        shell: bash
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Commit-message validator tests
        shell: bash
        run: sh tests/commit_msg.sh
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check
        run: cargo check --locked
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked
      - name: Release build
        run: cargo build --release --locked
      - name: TUI terminal integration
        if: runner.os == 'Linux'
        run: python3 tests/tui_pty.py target/release/maxonkey
      - name: Vault terminal integration
        if: runner.os == 'Linux'
        run: python3 tests/vault_pty.py target/release/maxonkey
      - name: Dependency advisories and licenses
        if: runner.os == 'Linux'
        shell: bash
        env:
          CARGO_DENY_VERSION: "0.20.2"
          CARGO_DENY_SHA256: "9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f"
        run: |
          archive="cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl"
          curl -sSfL -o "$RUNNER_TEMP/cargo-deny.tgz" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/${archive}.tar.gz"
          echo "${CARGO_DENY_SHA256}  $RUNNER_TEMP/cargo-deny.tgz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/cargo-deny.tgz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/${archive}/cargo-deny" --locked check advisories licenses

  policy:
    name: Repository policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Commit messages
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          # The PR head, not GitHub's synthetic merge checkout, so branch merge commits are checked.
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # Validate only the new commits; earlier history is never rewritten.
          if [ -z "$BASE_SHA" ] || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            commits=$HEAD_SHA
          else
            commits=$(git rev-list "$BASE_SHA..$HEAD_SHA")
          fi
          # On pull requests, use the base branch's validator so a PR cannot weaken its own check.
          hook=.githooks/commit-msg
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            git show "$BASE_SHA:.githooks/commit-msg" > "$RUNNER_TEMP/commit-msg"
            hook="$RUNNER_TEMP/commit-msg"
          fi
          attribution='co-authored-by:|generated (with|by) \[?(claude|codex|chatgpt|an? ai)|written by (claude|codex)|created with (claude|codex)|🤖'
          status=0
          for c in $commits; do
            git cat-file commit "$c" | sed '1,/^$/d' > "$RUNNER_TEMP/msg"
            if ! sh "$hook" "$RUNNER_TEMP/msg"; then
              echo "::error::Commit $c does not follow 'Type: Short description'"
              status=1
            fi
            if grep -Eiq "$attribution" "$RUNNER_TEMP/msg"; then
              echo "::error::Commit $c contains AI self-attribution (AGENTS.md Rule 2)"
              status=1
            fi
          done
          exit $status
      - name: Secret scan (full history)
        shell: bash
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          # Use built-in rules from outside the checkout so a PR cannot add its own
          # .gitleaks.toml or .gitleaksignore to silence the scan.
          printf '[extend]\nuseDefault = true\n' > "$RUNNER_TEMP/gitleaks.toml"
          : > "$RUNNER_TEMP/gitleaksignore"
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner \
            --config "$RUNNER_TEMP/gitleaks.toml" --gitleaks-ignore-path "$RUNNER_TEMP/gitleaksignore" .
      - name: Specification and link check
        run: python3 tests/spec_check.py
