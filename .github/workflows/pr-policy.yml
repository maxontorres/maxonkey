name: PR policy

# Runs on pull request metadata changes without re-running the Rust matrix.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review, converted_to_draft]

permissions:
  contents: read

concurrency:
  group: pr-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  metadata:
    name: PR metadata
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: Title, attribution, and specification reference
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          status=0
          # Rebase merges keep the validated commits; the title must still follow the convention.
          # Use the base branch's validator so a pull request cannot weaken its own check.
          git show "$BASE_SHA:.githooks/commit-msg" > "$RUNNER_TEMP/commit-msg"
          printf '%s\n' "$TITLE" > "$RUNNER_TEMP/title"
          if ! sh "$RUNNER_TEMP/commit-msg" "$RUNNER_TEMP/title"; then
            echo "::error::PR title must be 'Type: Short description'"
            status=1
          fi
          attribution='co-authored-by:|generated (with|by) \[?(claude|codex|chatgpt|an? ai)|written by (claude|codex)|created with (claude|codex)|🤖'
          if printf '%s\n%s\n' "$TITLE" "$BODY" | grep -Eiq "$attribution"; then
            echo "::error::Remove AI self-attribution from the PR title or description (AGENTS.md Rule 2)"
            status=1
          fi
          files=$(gh api --paginate "repos/$REPO/pulls/$NUMBER/files" \
            --jq '.[] | .filename, (.previous_filename // empty)')
          if printf '%s\n' "$files" | grep -Eq '^(src|tests)/'; then
            spec=$(printf '%s\n' "$BODY" | grep -Eo 'Spec: specs/[0-9]{3}-[a-z0-9-]+' | head -1 | cut -c7-)
            if [ -z "$spec" ] || [ ! -f "$spec/spec.md" ]; then
              echo "::error::Code changes need a 'Spec: specs/NNN-name' line naming an existing specification"
              status=1
            fi
          fi
          exit $status

  risk:
    name: Risk classification
    # Fork pull requests get a read-only token; they are never labeled or auto-merged.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      # No checkout: this job never runs pull request code with a write token.
      - name: Classify, label, escalate, and set auto-merge
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          set -euo pipefail
          files=$(gh api --paginate "repos/$REPO/pulls/$NUMBER/files" \
            --jq '.[] | .filename, (.previous_filename // empty)' | sort -u)
          # Low-risk paths are the unowned lines of CODEOWNERS on the base branch,
          # so a pull request cannot widen its own eligibility.
          lowrisk=$(gh api -H 'Accept: application/vnd.github.raw' \
            "repos/$REPO/contents/.github/CODEOWNERS?ref=$BASE_REF" 2>/dev/null \
            | grep -E '^/[^[:space:]]+$' | cut -c2- || true)
          sensitive="" eligible=true
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            printf '%s\n' "$lowrisk" | grep -Fxq -- "$f" || eligible=false
            case "$f" in
              src/crypto.rs|src/secret.rs|src/vault.rs|src/store.rs|src/paths.rs|src/prompt.rs|\
              src/commands.rs|src/main.rs|src/cli.rs|tests/cli.rs|Cargo.toml|Cargo.lock|deny.toml|rust-toolchain.toml|\
              .github/*|.githooks/*|.claude/*|.mcp.json|.agents/*|.specify/memory/*|\
              AGENTS.md|CLAUDE.md|docs/security.md|docs/adr/*|specs/*/spec.md|tests/vault_pty.py|\
              *mcp*|*auth*|*recover*|*broker*|*permission*|*secret*|*crypt*|*key*)
                sensitive="$sensitive- \`$f\`"$'\n' ;;
            esac
          done <<< "$files"
          [ -z "$files" ] && eligible=false

          gh label create security-sensitive --color B60205 --force \
            --description "Owner approval and independent review required" >/dev/null
          gh label create low-risk --color 0E8A16 --force \
            --description "Auto-merge eligible after all checks pass" >/dev/null
          set_label() {
            if [ "$2" = true ]; then
              gh api "repos/$REPO/issues/$NUMBER/labels" -f "labels[]=$1" >/dev/null
            else
              gh api -X DELETE "repos/$REPO/issues/$NUMBER/labels/$1" >/dev/null 2>&1 || true
            fi
          }
          set_label security-sensitive "$([ -n "$sensitive" ] && echo true || echo false)"
          set_label low-risk "$eligible"

          marker='<!-- maxonkey-security-escalation -->'
          id=$(gh api "repos/$REPO/issues/$NUMBER/comments" --paginate \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" | head -1)
          if [ -n "$sensitive" ]; then
            body="$marker
          @$OWNER this pull request changes security-sensitive paths:

          $sensitive
          Before merging: an independent Codex review of the current commit (comment \`@codex review\`
          if none appeared), owner approval, and green CI. Auto-merge is disabled for this pull request."
            if [ -n "$id" ]; then
              gh api -X PATCH "repos/$REPO/issues/comments/$id" -f body="$body" >/dev/null
            else
              gh pr comment "$NUMBER" --body "$body"
            fi
          elif [ -n "$id" ]; then
            # The pull request no longer touches sensitive paths; remove the outdated notice.
            gh api -X DELETE "repos/$REPO/issues/comments/$id" >/dev/null
          fi

          # Auto-merge only owner or Claude App pull requests that touch low-risk paths alone.
          if [ "$eligible" = true ] && [ "$DRAFT" = false ] && \
             { [ "$AUTHOR" = "$OWNER" ] || [ "$AUTHOR" = "claude[bot]" ]; }; then
            gh pr merge "$NUMBER" --auto --rebase \
              || echo "::warning::Auto-merge not enabled; turn on 'Allow auto-merge' in repository settings"
          else
            gh pr merge "$NUMBER" --disable-auto 2>/dev/null || true
          fi
          echo "eligible=$eligible sensitive=$([ -n "$sensitive" ] && echo yes || echo no)"
