name: PR risk

# Labels pull requests and escalates security-sensitive changes.
# pull_request_target runs this file from the base branch, so a pull request cannot
# change the commands that run with these write permissions. Never add a checkout of
# the pull request head, and never execute pull request files, in this workflow.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]

permissions: {}

concurrency:
  group: pr-risk-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  risk:
    name: Risk classification
    # Fork pull requests are skipped: they are never labeled or auto-merged.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      # Base-branch code only; the pull request head is never checked out here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Classify, label, and escalate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          result=$(bash .github/scripts/classify-pr.sh)
          eligible=$(printf '%s\n' "$result" | sed -n 's/^eligible=//p')
          sensitive=$(printf '%s\n' "$result" | sed -n 's/^sensitive=//p' \
            | while IFS= read -r f; do printf -- "- \`%s\`\n" "$f"; done)

          gh label create security-sensitive --color B60205 --force \
            --description "Owner approval and independent review required" >/dev/null
          gh label create low-risk --color 0E8A16 --force \
            --description "Merged automatically after all checks and Codex pass" >/dev/null
          set_label() {
            if [ "$2" = true ]; then
              gh api "repos/$REPO/issues/$NUMBER/labels" -f "labels[]=$1" >/dev/null
            else
              gh api -X DELETE "repos/$REPO/issues/$NUMBER/labels/$1" >/dev/null 2>&1 || true
            fi
          }
          set_label security-sensitive "$([ -n "$sensitive" ] && echo true || echo false)"
          set_label low-risk "$eligible"

          marker='<!-- maxonkey-security-escalation -->'
          id=$(gh api "repos/$REPO/issues/$NUMBER/comments" --paginate \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" | head -1)
          if [ -n "$sensitive" ]; then
            body="$marker
          @$OWNER this pull request changes security-sensitive paths:

          $sensitive

          It is never merged automatically. When CI and the Codex review pass, approve and merge it."
            if [ -n "$id" ]; then
              gh api -X PATCH "repos/$REPO/issues/comments/$id" -f body="$body" >/dev/null
            else
              gh pr comment "$NUMBER" --body "$body"
            fi
          elif [ -n "$id" ]; then
            # The pull request no longer touches sensitive paths; remove the outdated notice.
            gh api -X DELETE "repos/$REPO/issues/comments/$id" >/dev/null
          fi
          echo "eligible=$eligible sensitive=$([ -n "$sensitive" ] && echo yes || echo no)"
