name: Factory

# Orchestrates pull requests after CI or a Codex review finishes. Every trigger is a
# GitHub event; nothing runs on a schedule or by hand. These events always run this file
# from the default branch, so pull requests cannot change what runs here with write
# access. The pull request head is never checked out here.
on:
  workflow_run:
    workflows: [Rust CI, PR policy]
    types: [completed]
  issue_comment:
    types: [created, edited]
  # A change on main (an owner merge, a settings fix) re-checks every open pull request
  # and the task queue. The Factory's own merges do not trigger this.
  push:
    branches: [main]

permissions: {}

concurrency:
  group: factory-${{ github.event.workflow_run.pull_requests[0].number || github.event.issue.number || 'queue' }}
  cancel-in-progress: false

env:
  REPO: ${{ github.repository }}
  OWNER: ${{ github.repository_owner }}
  CODEX_LOGIN: ${{ vars.CODEX_REVIEWER_LOGIN || 'chatgpt-codex-connector[bot]' }}
  CODEX_REVIEW: ${{ vars.CODEX_REVIEW || 'required' }}

jobs:
  orchestrate:
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request') ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
       (github.event.comment.user.login == (vars.CODEX_REVIEWER_LOGIN || 'chatgpt-codex-connector[bot]') ||
        (github.event.comment.user.login == github.repository_owner &&
         startsWith(github.event.comment.body, '/accept-codex '))))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
      checks: read
      statuses: write
    outputs:
      # JSON list of {pr, sha, wait}: one Codex CLI fallback review per entry.
      fallbacks: ${{ steps.list.outputs.fallbacks }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Next step for the pull request
        id: next
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          NUMBER: ${{ github.event.workflow_run.pull_requests[0].number || github.event.issue.number }}
          FALLBACK_LIST: ${{ runner.temp }}/fallbacks.jsonl
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            # Re-check open pull requests (catches missed events and silent reviews), then the queue.
            for n in $(gh api "repos/$REPO/pulls?state=open&base=main&per_page=50" --jq '.[].number'); do
              NUMBER=$n bash .github/scripts/factory.sh || echo "::warning::Factory check failed for #$n"
            done
            bash .github/scripts/next-task.sh; exit 0
          fi
          if [ -z "$NUMBER" ] && [ -n "$HEAD_SHA" ]; then
            NUMBER=$(gh api "repos/$REPO/commits/$HEAD_SHA/pulls" --jq '.[0].number // empty')
          fi
          [ -n "$NUMBER" ] || { echo "No pull request for this event"; exit 0; }
          NUMBER=$NUMBER bash .github/scripts/factory.sh
      - name: List requested fallback reviews
        id: list
        env:
          FALLBACK_LIST: ${{ runner.temp }}/fallbacks.jsonl
        run: |
          list=$(jq -sc 'unique_by(.pr)' "$FALLBACK_LIST" 2>/dev/null || echo '[]')
          echo "fallbacks=${list:-[]}" >> "$GITHUB_OUTPUT"
          echo "fallbacks=${list:-[]}"

  # Codex has not reviewed a head commit: wait out the rest of its time, then review it
  # with Codex CLI in the same run. One review per pull request: a push sweep can list
  # several, and the per-PR group keeps two runs from reviewing the same pull request at once.
  codex-fallback:
    needs: orchestrate
    if: needs.orchestrate.outputs.fallbacks != '' && needs.orchestrate.outputs.fallbacks != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.orchestrate.outputs.fallbacks) }}
    concurrency:
      group: codex-fallback-${{ matrix.pr }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    uses: ./.github/workflows/codex-fallback.yml
    with:
      pr: ${{ matrix.pr }}
      sha: ${{ matrix.sha }}
      wait: ${{ matrix.wait }}
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

  # Act on each fallback result: merge, start a correction, or tell the owner.
  after-fallback:
    needs: [orchestrate, codex-fallback]
    if: >-
      always() && needs.orchestrate.result == 'success' &&
      needs.orchestrate.outputs.fallbacks != '' && needs.orchestrate.outputs.fallbacks != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.orchestrate.outputs.fallbacks) }}
    concurrency:
      group: factory-after-fallback-${{ matrix.pr }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
      checks: read
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Next step after the fallback review
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ matrix.pr }}
          NO_FALLBACK: "1"
        run: bash .github/scripts/factory.sh
